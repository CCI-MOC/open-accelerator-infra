all:
  vars:
    ansible_python_interpreter: /usr/bin/python3
    bmc_user: root
    bmc_password: "{{ lookup('env', 'BMC_PASSWORD') }}"
    bm_management: openstack
  hosts:
    oac-dev-bastion:
      node_name: MOC-R4PAC22U31-S3A
      bmc_addr: 10.2.12.165
      bmc_type: idrac
  children:
    oac_clusters:
      children:
        oac_dev_infra:
          vars:
            network_name: oac-infra
            bmc_type: idrac
            boot_image_url: "http://10.2.0.82/boot/agent.x86_64.iso"
            cluster: oac-dev-infra
          hosts:
            oac-dev-infra-control-0:
              node_name: MOC-R4PAC22U17-S1
              bmc_addr: 10.2.12.91
            oac-dev-infra-control-1:
              node_name: MOC-R4PAC22U15-S1
              bmc_addr: 10.2.12.81
            oac-dev-infra-control-2:
              node_name: MOC-R4PAC08U05-S3
              bmc_addr: 10.2.14.32
        oac_dev_workload0:
          vars:
            network_name: oac-dev-workload0
            cluster: oac-dev-workload0
            boot_image_url: "http://10.2.0.82/boot/oac-dev-infra-agent.iso"
          children:
            oac_dev_workload0_gpu:
              vars:
                bmc_type: lenovo
              hosts:
                oac-dev-workload0-gpu-0:
                  node_name: MOC-R4PCC02U05
                  bmc_addr: 10.2.19.105
                oac-dev-workload0-gpu-1:
                  node_name: MOC-R4PCC02U09
                  bmc_addr: 10.2.19.109
            oac_dev_workload0_compute:
              vars:
                bmc_type: idrac
              hosts:
                oac-dev-workload0-compute-0:
                  node_name: MOC-R4PAC21U03-S3
                  bmc_addr: 10.2.10.22
                oac-dev-workload0-compute-1:
                  node_name: MOC-R4PAC22U27-S1
                  bmc_addr: 10.2.12.141
                oac-dev-workload0-compute-2:
                  node_name: MOC-R4PAC22U29-S3
                  bmc_addr: 10.2.12.152
        oac_prod_infra:
          vars:
            cluster: oac-prod-infra
            bm_management: bmc
            bmc_type: idrac
          children:
            oac_prod_infra_controller:
              vars:
                boot_image_url: "http://10.2.0.82/boot/oac-prod-infra-agent.x86_64.iso"
              hosts:
                oac-prod-infra-control-0:
                  node_name: MOC-R4PAC10U33-S1A
                  bmc_addr: 10.2.13.171
                oac-prod-infra-control-1:
                  node_name: MOC-R4PAC10U35-S3B
                  bmc_addr: 10.2.13.186
                oac-prod-infra-control-2:
                  node_name: MOC-R4PAC10U37-S3C
                  bmc_addr: 10.2.13.197
            #   oac_prod_infra_compute:
            #     vars:
            #       boot_image_url: "http://10.2.0.82/boot/discovery-r440.iso"
            #     hosts:
            #       oac-prod-infra-compute-0:
            #         node_name: R440-TEMP-NAME-1
            #         bmc_addr: 10.3.10.114
            #       oac-prod-infra-compute-1:
            #         node_name: R440-TEMP-NAME-2
            #         bmc_addr: 10.3.10.115
            #       oac-prod-infra-compute-2:
            #         node_name: R440-TEMP-NAME-3
            #         bmc_addr: 10.3.10.116
            # fc830s temporarily used as computes while r440s issues are worked out
            oac_prod_infra_compute_temp:
              vars:
                boot_image_url: "http://10.2.0.82/boot/oac-prod-infra-agent.x86_64.iso"
              hosts:
                oac-prod-infra-compute-temp-0:
                  node_name: MOC-R4PAC10U11-S3
                  bmc_addr: 10.2.13.62
                oac-prod-infra-compute-temp-1:
                  node_name: MOC-R4PAC10U09-S3
                  bmc_addr: 10.2.13.52
                oac-prod-infra-compute-temp-2:
                  node_name: MOC-R4PAC10U19-S1
                  bmc_addr: 10.2.13.101
        oac_prod_workload0:
          vars:
            cluster: oac-prod-workload0
            bmc_type: idrac
            boot_image_url: "http://10.2.0.82/boot/prod-workload0-agent-discovery.iso"
          children:
            oac_prod_workload0_compute:
